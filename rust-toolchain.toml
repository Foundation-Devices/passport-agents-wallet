# Pinned to match the Foundation SDK 1.0.0 dev shell (see the SDK's flake.nix).
# The SDK's `server-macro` uses the unstable `proc_macro::track_path` feature,
# which newer nightlies removed, so the toolchain must match. rustup installs
# this automatically on first build.
[toolchain]
channel = "nightly-2025-09-11"
components = ["rustfmt", "clippy", "rustc", "rust-src"]
profile = "minimal"
