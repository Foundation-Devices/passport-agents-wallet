# appId = ASCII "nunchuk-sign-app" (exactly 16 bytes / 0x + 32 hex).
appId = "0x6e756e6368756b2d7369676e2d617070"

[appName]
en = "Agents"

[permissions]
template = ["gui-app", "fs-generic"]
"os/security" = ["GetAppSeed"]
"os/usbdev" = [
    "RegisterSetupResponder",
    "RegisterInterface",
    "NumInterfaces",
    "ReadEndpoint",
    "WriteEndpoint",
    "SetEndpointStalled",
    "IsDeviceEmulationEnabled",
    # Force a USB re-enumeration after registering our CDC interfaces at runtime.
    # Without this the host already enumerated the device (at boot, with no
    # interfaces) and never re-reads the config, so the CDC port never appears.
    # FIDO + mass-storage emulation use the same mechanism.
    "ResetController",
    "WaitForConnection",
]
# Per-location access grants. fs-generic grants the file *operations*; these grant
# the locations. The export file-picker can save the key/descriptor/signed-PSBT to
# Airlock, internal (User), or SD/USB, and imports are read from any of them — so
# read+write are needed on all three (else "AccessDenied").
"os/fs" = [
    "GetAirlockReadAccess",
    "GetAirlockWriteAccess",
    "GetUserReadAccess",
    "GetUserWriteAccess",
    "GetUsbReadAccess",
    "GetUsbWriteAccess",
]
